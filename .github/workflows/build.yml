name: Build desktop app

# Cross-building a Mac app from Windows (or vice versa) is not possible, so each
# installer is produced on its own runner and collected as an artifact. Pushing a
# v* tag additionally attaches them to a GitHub Release.
on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each push to main supersedes the last. Without this, runs that cannot get a
# runner pile up and sit queued for hours behind one another.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    # The architecture is set here on the CLI and nowhere else. The bundled Python
    # backend is built by PyInstaller on the runner, so it is native-only: a runner
    # must never emit an installer for the other architecture. This cannot be
    # recorded as a comment in desktop/package.json — electron-builder validates
    # that file against a strict schema and rejects an unknown "//" key outright,
    # which failed the build at config validation before doing any work.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple silicon
            name: mac-arm64
            builder_args: --mac --arm64
          # macos-13 was retired; jobs targeting it are never assigned a runner
          # and sit queued until GitHub expires them, which blocked `release`
          # (needs: build) so no tag ever produced a Release automatically.
          - os: macos-15-intel  # Intel
            name: mac-x64
            builder_args: --mac --x64
          - os: windows-latest
            name: win-x64
            builder_args: --win --x64
    runs-on: ${{ matrix.os }}
    # A leg that wedges should fail and let the others release, not run for hours.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build the frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          npm run build

      # Downloads the JRE (cjdk) and the Bio-Formats jars (Maven) once, then
      # copies them into backend/runtime so the app never needs them at run time.
      - name: Stage the Java runtime
        run: python scripts/stage_runtime.py

      - name: Package the backend
        run: pyinstaller backend/oir-viewer-backend.spec --noconfirm --distpath dist --workpath build

      # The smoke test below only proves the server answers. A build with no
      # working Java at all passes it — and one shipped: PyInstaller collects
      # modules but not .dist-info, scyjava reads its own metadata at import, and
      # every .oir failed while .tif kept working. This walks the real path.
      - name: Self-test Bio-Formats in the packaged backend
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/backend/oir-viewer-backend.exe; else EXE=dist/backend/oir-viewer-backend; fi
          "$EXE" --selftest

      - name: Smoke-test the packaged backend
        shell: bash
        run: |
          # It must start, serve the UI and answer the API without a system Java.
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/backend/oir-viewer-backend.exe; else EXE=dist/backend/oir-viewer-backend; fi
          OIR_BACKEND_PORT=8799 "$EXE" &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/api/images || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:8799/api/images
          curl -fsS -o /dev/null http://127.0.0.1:8799/
          echo "packaged backend OK"
          # Stop it: left running, the runner reports it as an orphan process.
          kill %1 2>/dev/null || true

      - name: Build the installer
        working-directory: desktop
        run: |
          npm install
          npx electron-builder ${{ matrix.builder_args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: oir-viewer-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  release:
    # `!cancelled()` rather than `success()`: one platform failing to build must
    # not withhold the installers that did build. The Release then simply carries
    # fewer files, which is visible, instead of not existing at all.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
