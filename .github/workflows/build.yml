name: Build desktop app

# Cross-building a Mac app from Windows (or vice versa) is not possible, so each
# installer is produced on its own runner and collected as an artifact. Pushing a
# v* tag additionally attaches them to a GitHub Release.
on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each push to main supersedes the last. Without this, runs that cannot get a
# runner pile up and sit queued for hours behind one another.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    # The architecture is set here on the CLI and nowhere else. The bundled Python
    # backend is built by PyInstaller on the runner, so it is native-only: a runner
    # must never emit an installer for the other architecture. This cannot be
    # recorded as a comment in desktop/package.json — electron-builder validates
    # that file against a strict schema and rejects an unknown "//" key outright,
    # which failed the build at config validation before doing any work.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple silicon
            name: mac-arm64
            builder_args: --mac --arm64
          # macos-13 was retired on 2025-12-04. Jobs targeting a retired label are
          # never assigned a runner and sit queued until GitHub expires them,
          # which blocked `release` (needs: build) so no tag ever produced a
          # Release automatically — for several versions, unnoticed.
          #
          # macos-15-intel is GitHub's documented replacement, and is itself the
          # last of its kind: x86_64 macOS runners end in August 2027. When this
          # label goes the same way, an Intel Mac build stops being possible on
          # GitHub-hosted runners at all, so drop the leg rather than relabel it.
          - os: macos-15-intel  # Intel
            name: mac-x64
            builder_args: --mac --x64
          - os: windows-latest
            name: win-x64
            builder_args: --win --x64
    runs-on: ${{ matrix.os }}
    # A leg that wedges should fail and let the others release, not run for hours.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build the frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          npm run build

      # Downloads the JRE (cjdk) and the Bio-Formats jars (Maven) once, then
      # copies them into backend/runtime so the app never needs them at run time.
      - name: Stage the Java runtime
        run: python scripts/stage_runtime.py

      - name: Package the backend
        run: pyinstaller backend/oir-viewer-backend.spec --noconfirm --distpath dist --workpath build

      # The smoke test below only proves the server answers. A build with no
      # working Java at all passes it — and one shipped: PyInstaller collects
      # modules but not .dist-info, scyjava reads its own metadata at import, and
      # every .oir failed while .tif kept working. This walks the real path.
      - name: Self-test Bio-Formats in the packaged backend
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/backend/oir-viewer-backend.exe; else EXE=dist/backend/oir-viewer-backend; fi
          "$EXE" --selftest

      - name: Smoke-test the packaged backend
        shell: bash
        run: |
          # It must start, serve the UI and answer the API without a system Java.
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/backend/oir-viewer-backend.exe; else EXE=dist/backend/oir-viewer-backend; fi
          # Regression for the packaged-only startup bug: a real user's home can
          # already contain a non-empty session.json from an older release. The
          # frozen executable must clear it before the first API response and
          # expose no tabs, exactly like the source build.
          python -c "import json, numpy as np, tifffile; from pathlib import Path; p=Path.home()/'.oir-viewer'; p.mkdir(parents=True, exist_ok=True); old=p/'old-session.tif'; tifffile.imwrite(old, np.arange(4, dtype=np.uint16).reshape(2,2)); (p/'session.json').write_text(json.dumps({'images':[{'source_path':str(old),'filename':old.name,'num_channels':1,'num_z':1,'num_t':1,'width':2,'height':2}]}), encoding='utf-8')"
          OIR_BACKEND_PORT=8799 "$EXE" &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/api/images || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:8799/api/images
          curl -fsS -o /dev/null http://127.0.0.1:8799/
          images=$(curl -fsS http://127.0.0.1:8799/api/images)
          [ "$images" = "[]" ] || { echo "packaged backend restored old session: $images"; exit 1; }
          python -c "import json; from pathlib import Path; assert json.loads((Path.home()/'.oir-viewer'/'session.json').read_text(encoding='utf-8')) == {'images': []}"
          echo "packaged backend OK"
          # Stop it: left running, the runner reports it as an orphan process.
          kill %1 2>/dev/null || true

      - name: Build the installer
        working-directory: desktop
        run: |
          npm install
          npx electron-builder ${{ matrix.builder_args }} --publish never

      # macOS ships the .app inside the DMG, so the app has to be signed before
      # the DMG is built — hence --dir above is not used and the app is signed in
      # place, then the DMG is rebuilt around it.
      #
      # Why this exists: with no signing identity on the runner, electron-builder
      # skips signing entirely and leaves Electron's own linker signature on the
      # binary. That signature declares sealed resources the bundle does not
      # have, so `codesign --verify` fails outright — and a quarantined app with a
      # BROKEN signature is reported by macOS as "damaged", which reads as a
      # corrupt download and offers no way forward. An ad-hoc signature is still
      # not notarized, but it is valid, so the same app instead gets the ordinary
      # "unidentified developer" prompt the user can allow.
      #
      # Not `mac.identity: null` in package.json: that was the obvious guess and
      # it is the opposite — electron-builder logs "skipped macOS code signing
      # reason=identity explicitly is set to null".
      - name: Sign the macOS app ad-hoc and verify it
        if: runner.os == 'macOS'
        run: |
          APP=$(find release -maxdepth 2 -name "*.app" -print -quit)
          [ -n "$APP" ] || { echo "no .app produced"; exit 1; }
          echo "signing $APP"
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          # Fail the build rather than ship an unopenable DMG: this is the exact
          # check that would have caught the broken signature in every release so
          # far, none of which was ever verified.
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q "Identifier=jp.ykobayashi.oirviewer" \
            || { echo "signed bundle kept Electron's identity"; exit 1; }

      - name: Rebuild the DMG around the signed app
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          APP=$(cd .. && find release -maxdepth 2 -name "*.app" -print -quit)
          rm -f ../release/*.dmg
          npx electron-builder ${{ matrix.builder_args }} \
            --prepackaged "../$APP" --publish never
          # And prove the app inside the shipped DMG is the signed one.
          cd ..
          DMG=$(find release -maxdepth 1 -name "*.dmg" -print -quit)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint /tmp/verify-dmg
          codesign --verify --deep --strict "/tmp/verify-dmg/OIR Viewer.app"
          hdiutil detach /tmp/verify-dmg
          echo "DMG contains a validly signed app"

      - uses: actions/upload-artifact@v4
        with:
          name: oir-viewer-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  release:
    # A public release is complete only when every supported platform has passed
    # its packaged-backend self-test, fresh-session HTTP smoke test, installer
    # build, and artifact upload. Never publish a partial set of installers.
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
